name: Publish OpenVam release ZIP

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag (openvam- followed by the ZIP SHA-256)'
        required: true
        type: string

jobs:
  publish:
    if: github.repository == 'bao270026-sys/deliveries' && startsWith(inputs.tag || github.event.release.tag_name, 'openvam-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          sparse-checkout: scripts
      - name: Verify the release ZIP and publish its original bytes
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          import unicodedata
          from pathlib import Path

          repo = "bao270026-sys/deliveries"
          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"openvam-([0-9a-fA-F]{64})", tag)
          if os.environ["GITHUB_REPOSITORY"] != repo or not match:
              sys.exit("Unexpected repository or delivery tag.")
          expected = match[1].lower()

          def metadata(path):
              return json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/{path}"]))

          release = metadata(f"releases/tags/{tag}")
          if release["tag_name"] != tag or release["draft"] or not release["published_at"]:
              sys.exit("A published release with this exact tag is required.")
          assets = metadata(f"releases/{int(release['id'])}/assets?per_page=2")
          if len(assets) != 1:
              sys.exit("Expected exactly one release asset.")
          asset = assets[0]
          if (asset["state"] != "uploaded" or not asset["name"].lower().endswith(".zip")
                  or asset.get("digest") != "sha256:" + expected or type(asset["size"]) is not int
                  or asset["size"] <= 0):
              sys.exit("Release asset metadata does not match the tagged ZIP.")
          if asset["size"] > 100 * 1024 * 1024:
              print("The complete ZIP is available as the release asset (over 100 MiB).")
              sys.exit(0)

          marker = "原始文件名："
          lines = [line.removesuffix("\r") for line in (release.get("body") or "").split("\n")]
          declared = [line[len(marker):] for line in lines if line.startswith(marker)]
          label = asset.get("label") or ""
          label_name = label if label.strip().lower().endswith(".zip") else None
          if len(declared) > 1 or (declared and label_name and declared[0] != label_name):
              sys.exit("Conflicting original filenames in the release.")
          name = declared[0] if declared else (label_name or asset["name"])
          if (name != name.strip() or len(name.encode()) > 255 or len(name) <= 4
                  or not name.lower().endswith(".zip") or any(c in '/\\:*?"<>|' for c in name)
                  or any(unicodedata.category(c) in {"Cc", "Cf", "Zl", "Zp"} for c in name)
                  or re.fullmatch(r"(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(\..*)?", name, re.I)):
              sys.exit("The original filename must be a single safe ZIP basename.")

          with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as tmp:
              archive = Path(tmp, name)
              endpoint = f"repos/{repo}/releases/assets/{int(asset['id'])}"
              with archive.open("xb") as output:
                  subprocess.run(["gh", "api", "-H", "Accept: application/octet-stream", endpoint],
                                 stdout=output, check=True)
              with archive.open("rb") as data:
                  actual = hashlib.file_digest(data, "sha256").hexdigest()
              if archive.stat().st_size != asset["size"] or actual != expected:
                  sys.exit("Downloaded ZIP size or SHA-256 mismatch.")
              # This file is already a release asset. The mirror succeeds only after a Git write.
              sys.path.insert(0, str(Path("scripts").resolve()))
              from publish_openvam import publish
              print(json.dumps(publish(Path.cwd(), archive), ensure_ascii=False))
